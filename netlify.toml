# Netlify build configuration
# The Astro portfolio lives in the ./site subfolder and outputs a static
# build, so no Astro SSR adapter is needed — Netlify just publishes ./site/dist.

[build]
  # Run the build from inside the site/ subfolder...
  base = "site"
  command = "npm run build"
  # ...publish path is relative to `base`, so this is site/dist
  publish = "dist"

[build.environment]
  # Astro 4 requires a modern Node runtime
  NODE_VERSION = "20"

# Long-cache the hashed, immutable assets Astro emits under /_astro/
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
